apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus
  namespace: nimbus
  labels:
    app: nimbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimbus
  template:
    metadata:
      labels:
        app: nimbus
      annotations:
        # Scrape Nimbus's own Prometheus metrics (GET /metrics on the app port).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: nimbus-sa
      containers:
        - name: nimbus
          image: docker.prayujt.com/nimbus # replace with custom registry
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DOMAIN
              value: <server host> # e.g. prayujt.com, specifies the base domain for new public routes
            - name: ENVOY_GATEWAY_NAME
              value: edge
            - name: ENVOY_GATEWAY_NAMESPACE
              value: envoy-gateway-system
            - name: ENVOY_HTTP_LISTENER
              value: http
            - name: ENVOY_READY_TIMEOUT_SECONDS
              value: "180"
            # Required for SPA or external-auth services: use this Nimbus build's digest.
            - name: NIMBUS_ROUTE_HELPER_IMAGE
              value: "<registry>/nimbus@sha256:<actual-manifest-digest>"
            - name: DB_USER
              value: <database username>
            - name: DB_PASSWORD
              value: <database password>
            - name: DB_HOST
              value: <database host>
            - name: DB_NAME
              value: <database name>
            - name: DB_PORT
              value: 5432
            - name: NIMBUS_STORAGE_CLASS
              value: <storage class> # storage class of the created PV
          args:
            - "server"
          volumeMounts:
            - mountPath: "/volumes" # must always be mounted to /volumes
              name: nimbus-volumes
      volumes:
        - name: nimbus-volumes
          persistentVolumeClaim:
            claimName: <pvc name> # create your own PVC that binds to the same PV as above, must also be ReadWriteMany
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus
  namespace: nimbus
  labels:
    app: nimbus
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: nimbus
  type: ClusterIP
