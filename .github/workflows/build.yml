name: Build Docker Image

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: docker.prayujt.com/nimbus

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.prayujt.com
          username: ${{ secrets.PRAYUJ_DOCKER_USERNAME }}
          password: ${{ secrets.PRAYUJ_DOCKER_PASSWORD }}

      - name: Build and push image with ko
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: ko build ./cmd --bare --platform=linux/amd64,linux/arm64 --tags="$IMAGE_TAG,latest"
