name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/nimbus ./cmd
      - name: Render route fixtures
        run: NIMBUS_ROUTE_FIXTURES=/tmp/routes.json go test ./internal/kubernetes -run TestExportRouteFixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned Envoy schemas and translation
        run: |
          python -m pip install 'PyYAML==6.0.2' 'jsonschema==4.25.1'
          curl --fail --location --retry 3 https://github.com/envoyproxy/gateway/releases/download/v1.9.1/install.yaml -o /tmp/envoy-install.yaml
          curl --fail --location --retry 3 https://github.com/envoyproxy/gateway/releases/download/v1.9.1/egctl_v1.9.1_linux_amd64.tar.gz -o /tmp/egctl.tar.gz
          mkdir /tmp/egctl
          tar -xzf /tmp/egctl.tar.gz -C /tmp/egctl
          python scripts/validate-routes.py /tmp/routes.json /tmp/envoy-install.yaml --egctl /tmp/egctl/bin/linux/amd64/egctl
